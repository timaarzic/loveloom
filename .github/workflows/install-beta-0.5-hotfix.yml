name: Install LoveLoom beta 0.5 notification hotfix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-beta-0.5-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Verify and apply hotfix
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode release-beta-0.5-hotfix.b64 > /tmp/loveloom-beta-0.5-hotfix.tar.gz
          echo "e5cd62fc3bf1efa96103bd49d012bcb1f0e995a0f14143c9a4ee179d6cee0d15  /tmp/loveloom-beta-0.5-hotfix.tar.gz" | sha256sum --check -
          tar -xzf /tmp/loveloom-beta-0.5-hotfix.tar.gz
          rm release-beta-0.5-hotfix.b64
          rm .github/workflows/install-beta-0.5-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: release beta 0.5 notification hotfix"
          git push origin HEAD:main
      - name: Trigger final Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
