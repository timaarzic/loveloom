name: Install LoveLoom beta 0.5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-beta-0.5.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply beta 0.5
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode release-beta-0.5.b64 > /tmp/loveloom-beta-0.5.tar.gz
          tar -xzf /tmp/loveloom-beta-0.5.tar.gz
          rm release-beta-0.5.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: release LoveLoom beta 0.5"
          git push origin HEAD:main
      - name: Trigger final Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
