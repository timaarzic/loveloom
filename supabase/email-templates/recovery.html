<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Восстановление доступа — LoveLoom</title>
  </head>
  <body style="margin:0;background:#f7f1ef;color:#392c30;font-family:Arial,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f7f1ef;padding:30px 14px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fffdfa;border:1px solid #eadfdc;border-radius:24px;overflow:hidden">
            <tr>
              <td style="padding:34px;text-align:center">
                <div style="font-family:Georgia,serif;font-size:30px">LoveLoom<span style="color:#b5516a">.</span></div>
                <h1 style="margin:22px 0 0;font-family:Georgia,serif;font-size:30px;font-weight:normal">Вернуть доступ</h1>
                <p style="margin:16px auto 24px;max-width:420px;color:#786970;font-size:15px;line-height:1.7">По этой кнопке можно безопасно задать новый пароль к аккаунту.</p>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 25px;border-radius:13px;background:#b5516a;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700">Изменить пароль</a>
                <p style="margin:24px 0 0;color:#998b90;font-size:12px;line-height:1.6">Не запрашивали восстановление? Ничего не нажимайте — пароль останется прежним.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
