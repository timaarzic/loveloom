name: Install LoveLoom beta 0.6.2

on:
  push:
    branches: [main]
    paths:
      - release-beta-0.6.2.b64

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify and install release
        shell: bash
        run: |
          base64 --decode release-beta-0.6.2.b64 > /tmp/loveloom-beta-0.6.2.tar.gz
          echo "10f58348d08dbe63f532f5e25f9103099f76b8af06d03c07b0b9de4f83ee91a0  /tmp/loveloom-beta-0.6.2.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/loveloom-beta-0.6.2.tar.gz
          rm release-beta-0.6.2.b64
          rm .github/workflows/install-beta-0.6.2.yml
      - name: Publish release commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: release LoveLoom beta 0.6.2"
          git push origin main
